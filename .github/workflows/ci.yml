name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build, vet & test
        run: |
          go build ./...
          go vet ./...
          go test -skip 'TestBuild$|TestPullNoBranchTags$|TestColorCodes$|TestBuildImage$|TestTagImage$|TestImageExist$' ./...
